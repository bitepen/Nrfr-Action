name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 替换包含隐藏 API 的 android.jar
      - name: Download android.jar
        run: |
          mkdir -p $ANDROID_HOME/platforms/android-34
          curl -L https://raw.githubusercontent.com/Reginer/aosp-android-jar/refs/heads/main/android-34/android.jar -o $ANDROID_HOME/platforms/android-34/android.jar

      # 编译 Release APK
      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # 自动生成签名并对 APK 完成 v2/v3 签名
      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.jks -alias nrfr \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Nrfr,O=Nrfr,C=US"

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-key-alias nrfr \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out nrfr-release-signed.apk \
            "$UNSIGNED_APK"

      # 方式一：运行结束后直接在 Actions 页面底部的 Artifacts 处下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nrfr-release-signed
          path: nrfr-release-signed.apk
          retention-days: 7

      # 方式二：如果推送了 v* 标签，自动发布到 Releases 页面
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nrfr-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
